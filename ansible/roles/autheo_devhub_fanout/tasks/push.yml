---
- name: Skip Dev Hub artifact push on its build host
  ansible.builtin.meta: end_host
  when: inventory_hostname == autheo_devhub_build_host

- name: Require a canonical Dev Hub revision from this run
  ansible.builtin.assert:
    that:
      - hostvars[autheo_devhub_build_host].autheo_devhub_canonical_revision is defined
      - (hostvars[autheo_devhub_build_host].autheo_devhub_canonical_revision | length) > 0
      - hostvars[autheo_devhub_build_host].autheo_devhub_canonical_build_id is defined
    fail_msg: >-
      No canonical Dev Hub build was published by {{ autheo_devhub_build_host }}.
      Refusing to prepare {{ hive_name }} with an unknown bundle.

- name: Clone or update the authoritative Dev Hub repository
  ansible.builtin.git:
    repo: "{{ autheo_devhub_repo }}"
    dest: "{{ autheo_devhub_source_dir }}"
    version: "{{ autheo_devhub_version }}"
    force: true
    accept_hostkey: true
    key_file: "{{ autheo_devhub_deploy_key_path | default(omit, true) }}"

- name: Pin the Dev Hub source to the canonical build revision
  ansible.builtin.command:
    cmd: "git checkout --detach {{ hostvars[autheo_devhub_build_host].autheo_devhub_canonical_revision }}"
    chdir: "{{ autheo_devhub_source_dir }}"
  changed_when: false

- name: Require the pinned Dev Hub application package
  ansible.builtin.stat:
    path: "{{ autheo_devhub_app_dir }}/package.json"
  register: _autheo_devhub_push_package

- name: Fail when the pinned Dev Hub application is absent
  ansible.builtin.assert:
    that: _autheo_devhub_push_package.stat.exists
    fail_msg: >-
      {{ inventory_hostname }}: canonical Dev Hub revision does not contain
      {{ autheo_devhub_app_dir }}/package.json.

- name: Template the Dev Hub runtime environment
  ansible.builtin.template:
    src: "{{ role_path }}/../autheo_devhub/templates/autheo-devhub.env.j2"
    dest: "{{ autheo_devhub_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install Dev Hub dependencies from the canonical lockfile
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ autheo_devhub_app_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
  async: 900
  poll: 15

- name: Push the canonical Dev Hub Next artifact
  ansible.builtin.copy:
    src: "{{ hive_artifact_root }}/autheo-devhub-next.tar.gz"
    dest: "{{ autheo_devhub_source_dir }}/autheo-devhub-next.tar.gz"
    mode: "0644"
  throttle: "{{ hive_push_throttle | default(4) }}"
