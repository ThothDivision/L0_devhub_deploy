---
# One canonical Next build avoids mixed content-hashed chunks behind any future
# ingress route. The repository, rather than this deployment repo's ui/, is the
# source of truth for the Dev Hub.

- name: Clone or update the authoritative Dev Hub repository on the build host
  ansible.builtin.git:
    repo: "{{ autheo_devhub_repo }}"
    dest: "{{ autheo_devhub_source_dir }}"
    version: "{{ autheo_devhub_version }}"
    force: true
    accept_hostkey: true
    key_file: "{{ autheo_devhub_deploy_key_path | default(omit, true) }}"

- name: Require the Dev Hub application package on the build host
  ansible.builtin.stat:
    path: "{{ autheo_devhub_app_dir }}/package.json"
  register: _autheo_devhub_build_package

- name: Fail when the build repository has no Dev Hub application
  ansible.builtin.assert:
    that: _autheo_devhub_build_package.stat.exists
    fail_msg: >-
      {{ inventory_hostname }}: {{ autheo_devhub_repo }} has no package.json at
      {{ autheo_devhub_app_dir }}. Refusing to build an unspecified application.

- name: Template the Dev Hub build environment
  ansible.builtin.template:
    src: "{{ role_path }}/../autheo_devhub/templates/autheo-devhub.env.j2"
    dest: "{{ autheo_devhub_app_dir }}/.env.local"
    mode: "0600"
  no_log: true

- name: Install Dev Hub dependencies from its lockfile
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ autheo_devhub_app_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
  async: 900
  poll: 15

- name: Build the canonical Dev Hub production bundle
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ autheo_devhub_app_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
    NODE_ENV: production
  async: 900
  poll: 15

- name: Read the canonical Dev Hub revision and BUILD_ID
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      printf '%s %s\n' "$(git -C '{{ autheo_devhub_source_dir }}' rev-parse HEAD)" "$(cat .next/BUILD_ID)"
    chdir: "{{ autheo_devhub_app_dir }}"
    executable: /bin/bash
  register: _autheo_devhub_build_identity
  changed_when: false

- name: Package the canonical Dev Hub Next build
  ansible.builtin.command:
    cmd: tar -C .next --exclude cache -czf {{ autheo_devhub_source_dir }}/autheo-devhub-next.tar.gz .
    chdir: "{{ autheo_devhub_app_dir }}"

- name: Publish canonical Dev Hub artifact facts
  ansible.builtin.set_fact:
    autheo_devhub_canonical_revision: "{{ _autheo_devhub_build_identity.stdout.split()[0] }}"
    autheo_devhub_canonical_build_id: "{{ _autheo_devhub_build_identity.stdout.split()[1] }}"

- name: Fetch the canonical Dev Hub artifact to the control host
  ansible.builtin.fetch:
    src: "{{ autheo_devhub_source_dir }}/autheo-devhub-next.tar.gz"
    dest: "{{ hive_artifact_root }}/autheo-devhub-next.tar.gz"
    flat: true

- name: Remove the packaged Dev Hub artifact from the build host
  ansible.builtin.file:
    path: "{{ autheo_devhub_source_dir }}/autheo-devhub-next.tar.gz"
    state: absent
