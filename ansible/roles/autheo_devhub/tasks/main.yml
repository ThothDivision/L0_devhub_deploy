---
# Standalone Dev Hub deployment. This intentionally never references hive-ui:
# Dev Hub serves loopback :3001, while the existing dashboard remains :3002.

- name: Clone or update the authoritative Autheo Dev Hub repository
  ansible.builtin.git:
    repo: "{{ autheo_devhub_repo }}"
    dest: "{{ autheo_devhub_source_dir }}"
    version: "{{ autheo_devhub_version }}"
    force: true
    accept_hostkey: true
    key_file: "{{ autheo_devhub_deploy_key_path | default(omit, true) }}"

- name: Require the Dev Hub application package
  ansible.builtin.stat:
    path: "{{ autheo_devhub_app_dir }}/package.json"
  register: _autheo_devhub_package

- name: Fail when the configured Dev Hub application is absent
  ansible.builtin.assert:
    that: _autheo_devhub_package.stat.exists
    fail_msg: >-
      {{ inventory_hostname }}: no package.json at {{ autheo_devhub_app_dir }}.
      The configured repository {{ autheo_devhub_repo }} must contain the Next.js
      Dev Hub application at that path.

- name: Locate the node binary for the Dev Hub unit
  ansible.builtin.shell: |
    set -u
    p="$(command -v node 2>/dev/null || true)"
    if [ -z "$p" ]; then
      for c in /usr/local/bin/node /usr/bin/node /opt/node/bin/node; do
        [ -x "$c" ] && { p="$c"; break; }
      done
    fi
    printf '%s' "$p"
  args:
    executable: /bin/bash
  register: _autheo_devhub_node
  changed_when: false
  failed_when: false

- name: Require node for the Dev Hub
  ansible.builtin.assert:
    that: (_autheo_devhub_node.stdout | trim) | length > 0
    fail_msg: >-
      node was not found on {{ inventory_hostname }}, so autheo-devhub cannot
      start. Install the fleet Node.js runtime, then re-run this role.

- name: Record node's directory for the Dev Hub unit PATH
  ansible.builtin.set_fact:
    autheo_devhub_node_dir: "{{ (_autheo_devhub_node.stdout | trim) | dirname }}"

- name: Install the Autheo Dev Hub runtime environment
  ansible.builtin.template:
    src: autheo-devhub.env.j2
    dest: "{{ autheo_devhub_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart autheo-devhub

- name: Ensure the Dev Hub release directory exists
  ansible.builtin.file:
    path: "{{ autheo_devhub_runtime_dir }}/releases"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Dev Hub dependencies from its lockfile
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ autheo_devhub_app_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
  async: 900
  poll: 15

- name: Build the Dev Hub production bundle
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ autheo_devhub_app_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
    NODE_ENV: production
    # Browser-visible Next.js variables are inlined during this build, not read
    # from the systemd EnvironmentFile at runtime.
    NEXT_PUBLIC_MARKETPLACE_URL: "{{ autheo_devhub_marketplace_url }}"
  async: 900
  poll: 15

- name: Atomically publish the built Dev Hub runtime
  ansible.builtin.shell: |
    set -euo pipefail
    runtime="{{ autheo_devhub_runtime_dir }}"
    releases="$runtime/releases"
    release="$releases/{{ ansible_date_time.epoch }}-$(git -C '{{ autheo_devhub_source_dir }}' rev-parse --short=12 HEAD)"
    stage="$(mktemp -d "$releases/.staging.XXXXXX")"
    trap 'rm -rf "$stage"' EXIT
    rsync -a --delete --exclude='.git' --exclude='.env.local' \
      "{{ autheo_devhub_app_dir }}/" "$stage/"
    mv "$stage" "$release"
    old="$(readlink -f "$runtime/current" 2>/dev/null || true)"
    ln -s "$release" "$runtime/.current.new"
    mv -Tf "$runtime/.current.new" "$runtime/current"
    if [ -n "$old" ] && [ -d "$old" ]; then
      ln -sfn "$old" "$runtime/previous"
    fi
  args:
    executable: /bin/bash
  notify: restart autheo-devhub

- name: Template the Autheo Dev Hub systemd unit
  ansible.builtin.template:
    src: autheo-devhub.service.j2
    dest: /etc/systemd/system/autheo-devhub.service
    mode: "0644"
  notify: [reload systemd, restart autheo-devhub]

- name: Flush handlers so health checks inspect the final Dev Hub
  ansible.builtin.meta: flush_handlers

- name: Enable and start Autheo Dev Hub
  ansible.builtin.systemd:
    name: autheo-devhub
    state: started
    enabled: true
    daemon_reload: true

- name: Verify the Dev Hub home page on loopback
  ansible.builtin.uri:
    url: "http://{{ autheo_devhub_bind }}:{{ autheo_devhub_port }}/"
    method: GET
    status_code: [200, 307, 308]
  register: _autheo_devhub_home
  retries: 12
  delay: 5
  until: _autheo_devhub_home.status in [200, 307, 308]

- name: Verify the Dev Hub Network page on loopback
  ansible.builtin.uri:
    url: "http://{{ autheo_devhub_bind }}:{{ autheo_devhub_port }}/network"
    method: GET
    status_code: [200, 307, 308]
  register: _autheo_devhub_network
  retries: 12
  delay: 5
  until: _autheo_devhub_network.status in [200, 307, 308]
