[package]
name = "hive-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluid-tunnel = { workspace = true }
# The `hive/browser/0` wire contract, shared verbatim with the wasm32-only
# `crates/hive-browser` (which path-depends on this same crate despite being
# workspace-excluded). Never re-declare its constants locally.
hive-browser-proto = { path = "../hive-browser-proto" }
tokio = { workspace = true }
bytes = "1"
anyhow = { workspace = true }
tracing = { workspace = true }
# Do not inherit iroh's `tls-ring` default: the endpoint supplies the AWS-LC
# provider explicitly and keeps X25519 only as an interoperability fallback.
iroh = { version = "1", default-features = false, features = ["metrics", "portmapper", "tls-aws-lc-rs"] }
# `Connection::handshake_data` is an erased value.  This direct dependency is
# solely for downcasting it to rustls' authoritative negotiated KEX metadata.
noq = { version = "1.0.1", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
# Public mainline-DHT (pkarr/BEP-44) address lookup — see `src/dht.rs` for what
# becomes publicly resolvable and how it is gated. `iroh-mainline-address-lookup`
# 0.4 depends on iroh ^1.0 / iroh-dns ^1.0, matching the pins above; it does NOT
# re-export `n0_mainline`, so `DhtBuilder` needs its own direct dependency.
iroh-mainline-address-lookup = "0.4"
n0-mainline = "0.5"
# The `AddressLookup` trait's `resolve` returns `n0_future::boxed::BoxStream`,
# so implementing the counting wrapper in `src/dht.rs` requires the same crate
# iroh itself uses for that alias.
n0-future = "0.3"
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[bin]]
name = "p2p-demo"
path = "src/bin/p2p_demo.rs"
