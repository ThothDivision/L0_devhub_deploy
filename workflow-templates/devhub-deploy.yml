name: Deploy to Autheo DevHub
on:
  push:
    branches: [ $default-branch ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ThothDivision/L0_devhub_deploy@main
        with:
          token: ${{ secrets.DEVHUB_TOKEN }}
